# Keeps the formula on the latest release of marqius-wkhtmltopdf, and proves it works first:
#
#   every hour     when marqius.com's latest release is newer than the formula, each new build is
#                  checked against its published checksum, then installed, tested and audited on
#                  macOS (Apple silicon) and Linux (x86-64 and ARM64); only then is it committed
#   by hand        Actions > Formula > Run workflow: the same, now
#   on a change    to main, or in a pull request: the formula as it stands, on the same three
name: Formula

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: formula-${{ github.ref }}
  cancel-in-progress: false

jobs:
  follow:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.follow.outputs.changed }}
      version: ${{ steps.follow.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: follow
        name: Follow marqius.com's latest release
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 .github/follow-release.py
      - if: steps.follow.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formula
          path: Formula/marqius-wkhtmltopdf.rb
          retention-days: 7

  test:
    needs: follow
    if: needs.follow.outputs.changed == 'true' || github.event_name == 'push' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.follow.outputs.changed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: formula
          path: Formula
      # taps this repository as marqiushq/tap, straight from the working copy above
      - uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # main, 2026-11-20
      - name: Install, test and audit
        run: |
          brew install --formula marqiushq/tap/marqius-wkhtmltopdf
          brew test marqiushq/tap/marqius-wkhtmltopdf
          brew audit --strict --online --formula marqiushq/tap/marqius-wkhtmltopdf
          marqius-wkhtmltopdf --version
          "$(brew --prefix)/opt/marqius-wkhtmltopdf/libexec/bin/wkhtmltopdf" -V

  publish:
    needs: [follow, test]
    if: needs.follow.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: formula
          path: Formula
      - name: Commit the release that passed
        env:
          VERSION: ${{ needs.follow.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          grep -q "^  version \"$VERSION\"$" Formula/marqius-wkhtmltopdf.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/marqius-wkhtmltopdf.rb
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "marqius-wkhtmltopdf $VERSION" -m "Installed, tested and audited on macOS (Apple silicon) and Linux (x86-64, ARM64): $RUN_URL"
          git push -q origin HEAD:main
